app = "sparc-app"
primary_region = "iad"

[build]

[env]
  PORT = "4000"

[[mounts]]
  source = "sparc_data"
  destination = "/app/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256